:root{
  --bg:#0c0d10; --surface:#2e2f33; --surface-2:#45474d; --fg:#f5f5f2; --muted:#9a9ca3;
  --green:#2f8a5c; --amber:#f2ab2a; --brand-green:#2f8a5c; --brand-amber:#f2ab2a; --brand-edge:#226b46; --amber-edge:#d98a12; --green-edge:#226b46; --absent:#1b1c1f; --card:#1a1b1f;
  --display:'Fredoka','Nunito',system-ui,sans-serif; --body:'Nunito',system-ui,sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--body);overflow:hidden;-webkit-tap-highlight-color:transparent;user-select:none}
.app{height:100%;display:flex;flex-direction:column;max-width:520px;margin:0 auto;box-sizing:border-box;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:8px}
header{display:flex;align-items:center;justify-content:space-between;gap:8px;padding-bottom:8px}
h1{font-family:var(--display);font-weight:700;font-size:1.45rem;margin:0;letter-spacing:.01em}
h1 span{color:var(--brand-amber)}
.icon-btn{background:var(--surface);color:var(--fg);border:0;border-radius:10px;height:38px;min-width:38px;padding:0 12px;font:700 .85rem var(--body);cursor:pointer}
button:focus-visible{outline:2px solid var(--brand-amber);outline-offset:2px}
.lengths{display:flex;align-items:center;justify-content:center;gap:6px;padding:8px 0;border-top:1px solid var(--surface);border-bottom:1px solid var(--surface)}
.lengths small{color:var(--muted);font-weight:700;font-size:.78rem;margin-right:4px;text-transform:uppercase;letter-spacing:.05em}
.len{background:var(--surface);color:var(--fg);border:0;border-radius:9px;width:40px;height:34px;font:700 1rem var(--display);cursor:pointer}
.len[aria-pressed="true"]{background:var(--brand-green);box-shadow:inset 0 -3px 0 var(--brand-edge)}
.board-wrap{flex:1;display:flex;align-items:center;justify-content:center;min-height:0;padding:10px 0}
.board{display:grid;gap:var(--gap,6px)}
.row{display:grid;gap:var(--gap,6px)}
.row.shake{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
.tile{background:var(--surface);border-radius:calc(var(--tile,56px) * .2);display:flex;align-items:center;justify-content:center;
  width:var(--tile,56px);height:var(--tile,56px);font-family:var(--display);font-weight:600;font-size:calc(var(--tile,56px) * .52);
  text-transform:uppercase;box-shadow:inset 0 -3px 0 rgba(0,0,0,.25)}
.tile.filled{background:var(--surface-2);animation:pop .1s}
@keyframes pop{50%{transform:scale(1.08)}}
.tile.correct{background:var(--green);box-shadow:inset 0 -4px 0 var(--green-edge)}
.tile.present{background:var(--amber);box-shadow:inset 0 -4px 0 var(--amber-edge)}
.tile.absent{background:var(--absent);color:#c9cad0}
.tile.flip{animation:flip .45s ease both}
@keyframes flip{0%{transform:rotateX(0)}50%{transform:rotateX(90deg)}100%{transform:rotateX(0)}}
.kb{display:flex;flex-direction:column;gap:6px;padding-bottom:4px}
.kr{display:flex;gap:5px;justify-content:center}
.key{flex:1;max-width:44px;height:54px;border:0;border-radius:8px;background:var(--surface-2);color:var(--fg);
  font:700 1.05rem var(--body);cursor:pointer;padding:0;touch-action:manipulation}
.key.wide{max-width:66px;flex:1.5;font-size:.75rem}
.key:active{filter:brightness(1.25)}
.key.correct{background:var(--green)} .key.present{background:var(--amber)} .key.absent{background:var(--absent);color:#6d6f75}
.toast{position:fixed;left:50%;top:calc(110px + env(safe-area-inset-top,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);
  font-weight:800;padding:10px 16px;border-radius:10px;z-index:20;max-width:calc(100% - 32px);text-align:center}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);display:flex;align-items:center;justify-content:center;z-index:30;padding:16px}
.card{background:var(--card);border-radius:18px;padding:22px;width:100%;max-width:360px;text-align:center;box-sizing:border-box}
.card h2{font-family:var(--display);margin:0 0 6px;font-size:1.5rem}
.card p{color:var(--muted);margin:6px 0;line-height:1.45}
.answer{display:inline-flex;gap:4px;margin:10px 0;flex-wrap:wrap;justify-content:center}
.answer b{width:34px;height:34px;border-radius:8px;background:var(--green);display:flex;align-items:center;justify-content:center;font-family:var(--display);font-size:1.15rem}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:14px 0;font-variant-numeric:tabular-nums}
.stats div{font-size:1.5rem;font-weight:800;font-family:var(--display)}
.stats small{display:block;font-size:.65rem;color:var(--muted);font-family:var(--body);font-weight:700;text-transform:uppercase;letter-spacing:.04em}
.legend{display:flex;flex-direction:column;gap:8px;text-align:left;margin:12px 0}
.legend span{display:flex;align-items:center;gap:10px;color:var(--fg)}
.legend i{width:28px;height:28px;border-radius:7px;flex:none}
.primary{background:var(--brand-green);color:#fff;border:0;border-radius:12px;padding:13px 20px;font:800 1rem var(--body);width:100%;margin-top:8px;cursor:pointer}
@media (prefers-reduced-motion:reduce){.tile.flip,.tile.filled,.row.shake{animation:none}}
@media (max-height:640px){.key{height:46px}}

h1{font-size:1.3rem;white-space:nowrap}
.tools{display:flex;gap:6px}
.icon-btn{display:inline-flex;align-items:center;justify-content:center;padding:0 9px}
#hintBtn.used{color:var(--brand-amber)}
.bar{display:flex;align-items:center;justify-content:center;gap:10px;padding:8px 0;border-top:1px solid var(--surface);border-bottom:1px solid var(--surface)}
.lengths{display:flex;gap:5px;padding:0;border:0}
.len{width:34px}
.seg{display:flex;background:var(--surface);border-radius:10px;padding:3px}
.seg button{border:0;background:none;color:var(--muted);font:800 .82rem var(--body);padding:7px 10px;border-radius:8px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--surface-2);color:var(--fg)}
.hint-line{text-align:center;color:var(--muted);font-size:.85rem;padding-top:6px}
.hint-line b{color:var(--fg);background:var(--surface-2);padding:1px 7px;border-radius:5px}
.sub{font-size:.8rem;margin-top:4px}
.dist{display:flex;flex-direction:column;gap:4px;margin:8px 0 14px;font-variant-numeric:tabular-nums}
.drow{display:flex;align-items:center;gap:8px;font-weight:800;font-size:.85rem}
.drow span{width:12px;color:var(--muted)}
.dbar{background:var(--surface-2);border-radius:4px;padding:3px 7px;text-align:right;min-width:22px;box-sizing:border-box}
.dbar.now{background:var(--green)}
.secondary{background:var(--surface);color:var(--fg);border:0;border-radius:12px;padding:12px 20px;font:800 .95rem var(--body);width:100%;margin-top:8px;cursor:pointer}
.opt{display:flex;align-items:center;justify-content:space-between;gap:12px;text-align:left;padding:12px 0;border-bottom:1px solid var(--surface);cursor:pointer}
.opt b{display:block}.opt small{color:var(--muted);font-size:.8rem}
.opt input{position:absolute;opacity:0;pointer-events:none}
.sw{flex:none;width:44px;height:26px;border-radius:13px;background:var(--surface-2);position:relative;transition:background .2s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:var(--fg);transition:transform .2s}
.opt input:checked + .sw{background:var(--brand-green)}
.opt input:checked + .sw::after{transform:translateX(18px)}
.opt input:focus-visible + .sw{outline:2px solid var(--amber);outline-offset:2px}
textarea{width:100%;box-sizing:border-box;background:var(--bg);color:var(--fg);border:1px solid var(--surface-2);border-radius:10px;padding:10px;font:600 .95rem var(--body);margin:10px 0;user-select:text}
.theme-purple{--bg:#150e22;--surface:#2c2240;--surface-2:#453860;--absent:#1e1630;--card:#20172f;--muted:#ab9fc4;--brand-amber:#f5b63c}
.theme-blue{--bg:#0a1424;--surface:#1c2c44;--surface-2:#33476a;--absent:#122038;--card:#142139;--muted:#97a9c6;--brand-amber:#f5b63c}
.toast-btn{margin-left:8px;background:var(--brand-green);color:#fff;border:0;border-radius:8px;padding:6px 12px;font:800 .85rem var(--body);cursor:pointer}
.tile.cursor{outline:3px solid var(--fg);outline-offset:-3px;cursor:pointer}
.row .tile{cursor:default}
.tile.ghost{color:var(--green);box-shadow:inset 0 0 0 2px var(--green);opacity:.85}
.themes{display:flex;gap:10px;justify-content:center;margin:6px 0 4px}
.themes button{flex:1;border:2px solid transparent;border-radius:12px;padding:10px 4px 8px;color:var(--fg);font:800 .8rem var(--body);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:6px}
.themes button[aria-pressed="true"]{border-color:var(--brand-amber)}
.themes i{display:flex;gap:3px}.themes i b{width:12px;height:12px;border-radius:3px}
.opt-title{text-align:left;font-weight:800;margin:14px 0 4px}
.contrast{--green:#e8732c;--green-edge:#b9561a;--amber:#4f9fe8;--amber-edge:#2f78bd}
.card{max-height:calc(100vh - 32px);overflow-y:auto}
@media (max-width:370px){.seg button{padding:7px 7px}.len{width:30px}.bar{gap:6px}h1{font-size:1.15rem}}
</style>

function todayKey(){ const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0') }
function hash(str){ let h = 2166136261; for (const c of str){ h ^= c.codePointAt(0); h = Math.imul(h, 16777619) } return h >>> 0 }
function dailyWord(len, day){
  const list = BYLEN[len].slice().sort();
  const start = Date.UTC(2026, 0, 1), [y,m,d] = day.split('-').map(Number);
  const n = Math.round((Date.UTC(y, m-1, d) - start) / 864e5);
  // recorre la lista en un orden revuelto fijo para que no se repita pronto
  const order = list.map((w,i) => [hash(w + '#' + len), w]).sort((a,b) => a[0] - b[0]).map(x => x[1]);
  return order[((n % order.length) + order.length) % order.length];
}

function press(k){
  if (game.over || busy) return;
  if (k === 'Enter') return submit();
  if (k === 'ArrowLeft'){ cursor = Math.max(0, cursor - 1); return draw() }
  if (k === 'ArrowRight'){ cursor = Math.min(COLS - 1, cursor + 1); return draw() }
  if (k === 'Backspace'){
    if (slots[cursor]) slots[cursor] = '';
    else if (cursor > 0){ cursor--; slots[cursor] = '' }
    return draw();
  }
  slots[cursor] = k;
  // salta a la siguiente casilla vacía (hacia adelante y luego desde el inicio)
  for (let step = 1; step <= COLS; step++){ const j = (cursor + step) % COLS; if (!slots[j]){ cursor = j; break } if (step === COLS) cursor = Math.min(cursor + 1, COLS - 1) }
  draw();
}
const word = () => slots.join('');

function ghostLetters(){
  const g = Array(COLS).fill('');

  game.guesses.forEach(w => score(w, game.answer).forEach((r,i) => { if (r === 'correct') g[i] = [...w][i] }));
  if (game.hint) g[game.hint.pos] = game.hint.letter;

}

    t.textContent = cur[i] || gh[i] || '';

}
function score(guess, ans){

function getStats(){

  let s = store.get(statsKey(), null);
  if (!s){
    // une las estadísticas viejas (que estaban separadas por número de letras)
    s = Object.assign({}, base, { dist:[0,0,0,0,0,0] });
    LENGTHS.forEach(n => { const o = store.get(`ps-st-${mode}-${n}`, null); if (!o) return;
      s.played += o.played || 0; s.wins += o.wins || 0; s.best = Math.max(s.best, o.best || 0); s.streak = Math.max(s.streak, o.streak || 0);
      (o.dist || []).forEach((v,i) => s.dist[i] += v || 0); if (o.last && (!s.last || o.last > s.last)) s.last = o.last });
    store.set(statsKey(), s);
  }
  return Object.assign(base, s);
}

      s.streak = s.last === todayKey() ? Math.max(1, s.streak) : s.last === yk ? s.streak + 1 : 1; s.last = todayKey();
    } else s.streak++;
    s.best = Math.max(s.best, s.streak); buzz([40,60,40]);

}

      <div>${s.played ? Math.round(s.wins / s.played * 100) : 0}%<small>Ganadas</small></div>
      <div>${s.streak}<small>Racha</small></div>
      <div>${s.best}<small>Mejor</small></div>
    </div>
    <p class="sub">Intentos para ganar · modo ${mode === 'daily' ? 'Diario' : 'Libre'}, todas las longitudes</p>
    <div class="dist">${s.dist.map((n,i) => `<div class="drow"><span>${i+1}</span><div class="dbar${i === last ? ' now' : ''}" style="width:${Math.max(8, n / max * 100)}%">${n}</div></div>`).join('')}</div>`;
}
const praise = ['¡Genio!','¡Increíble!','¡Muy bien!','¡Bien hecho!','¡Lo lograste!','¡Por poco!'];
function showResult(){
  const nextBtn = mode === 'daily'
    ? `<p class="sub">Nueva palabra del día en <b id="countdown"></b></p><button class="secondary" id="toFree">Seguir en modo Libre</button>`
    : `<button class="secondary" id="againBtn">${settings.randomLen ? 'Jugar otra (largo al azar)' : 'Jugar otra'}</button>`;
  showModal(`
    <h2>${game.won ? praise[game.guesses.length-1] : 'Se acabaron los intentos'}</h2>
    <p>${game.won ? `Adivinaste en ${game.guesses.length} de ${ROWS} intentos.` : 'La palabra secreta era:'}</p>
    <div class="answer">${[...game.answer].map(c => `<b>${c.toUpperCase()}</b>`).join('')}</div>
    ${statsHTML()}
    <button class="primary" id="shareBtn">Compartir resultado</button>
    ${nextBtn}`);
  $('shareBtn').onclick = share;
  if ($('againBtn')) $('againBtn').onclick = () => { closeModal(); newFree() };
  if ($('toFree')) $('toFree').onclick = () => { closeModal(); mode = 'free'; store.set('ps-mode','free'); load() };
  tickCountdown();
}
let cdTimer;
function tickCountdown(){
  clearInterval(cdTimer);
  const el = $('countdown'); if (!el) return;
  const upd = () => {
    const now = new Date(), next = new Date(now); next.setHours(24,0,0,0);
    const s = Math.floor((next - now) / 1000);
    el.textContent = [Math.floor(s/3600), Math.floor(s%3600/60), s%60].map(n => String(n).padStart(2,'0')).join(':');
    if (s <= 0){ clearInterval(cdTimer); closeModal(); load() }
  };
  upd(); cdTimer = setInterval(upd, 1000);
}
function shareText(){
  const [g, y, b] = settings.contrast ? ['🟧','🟦','⬛'] : ['🟩','🟨','⬛'];
  const d = new Date(), date = d.getDate() + '/' + (d.getMonth()+1);
  const head = `Palabra Secreta ${mode === 'daily' ? date : '(libre)'} · ${COLS} letras ${game.won ? game.guesses.length : 'X'}/${ROWS}${settings.hard ? '*' : ''}${game.hint ? ' (con pista)' : ''}`;
  const grid = game.guesses.map(w => score(w, game.answer).map(r => r === 'correct' ? g : r === 'present' ? y : b).join('')).join('\n');
  return head + '\n\n' + grid;
}
function share(){
  const text = shareText();
  if (navigator.share && window.top === window){ navigator.share({ text }).catch(() => {}); return }
  const fallback = () => showModal(`<h2>Copia tu resultado</h2><textarea id="shareTxt" readonly rows="8">${text}</textarea><button class="primary" id="closeBtn">Listo</button>`, () => { const t = $('shareTxt'); t.focus(); t.select() });
  try{
    navigator.clipboard.writeText(text).then(() => toast('Resultado copiado. Pégalo en WhatsApp.'), fallback);
  }catch(e){ fallback() }
}

// ---------- pista ----------
$('hintBtn').onclick = () => {
  if (game.over) return toast('La partida ya terminó');
  if (game.hint) return toast(`Tu pista: la letra ${game.hint.pos+1} es ${game.hint.letter.toUpperCase()}`);
  const a = [...game.answer], known = new Set();
  game.guesses.forEach(w => score(w, game.answer).forEach((r,i) => { if (r === 'correct') known.add(i) }));
  const open = a.map((_,i) => i).filter(i => !known.has(i));
  if (!open.length) return toast('Ya tienes todas las letras');
  const pos = open[hash(game.answer + game.guesses.length) % open.length];
  game.hint = { pos, letter: a[pos] }; save(); showHint(); draw();
  toast(`Pista: la letra ${pos+1} es ${a[pos].toUpperCase()}`);
};
function showHint(){
  const h = $('hintLine');
  h.hidden = !game.hint;
  if (game.hint) h.innerHTML = `Pista: la letra <b>${game.hint.pos+1}</b> es <b>${game.hint.letter.toUpperCase()}</b>`;
  $('hintBtn').classList.toggle('used', !!game.hint);
}

// ---------- modales ----------
function showModal(html, after){ $('modalCard').innerHTML = html; $('modal').hidden = false;
  const c = $('closeBtn'); if (c) c.onclick = closeModal; if (after) after(); }
function closeModal(){ $('modal').hidden = true; clearInterval(cdTimer) }
$('modal').addEventListener('click', e => { if (e.target.id === 'modal') closeModal() });
let toastT;
function actionToast(msg, label, fn){
  const t = $('toast'); t.innerHTML = ''; t.append(msg + ' ');
  const b = document.createElement('button'); b.className = 'toast-btn'; b.textContent = label;
  b.onclick = () => { t.hidden = true; fn() }; t.appendChild(b);
  t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => t.hidden = true, 5000);
}
function toast(msg){ const t = $('toast'); t.textContent = msg; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => t.hidden = true, 2200) }

$('statsBtn').onclick = () => {
  if (game.over) return showResult();
  showModal(`<h2>Estadísticas</h2>${statsHTML()}<button class="primary" id="closeBtn">Cerrar</button>`);
};
$('helpBtn').onclick = () => showModal(`
  <h2>Cómo jugar</h2>
  <p>Adivina la palabra secreta en 6 intentos. Elige de 5 a 8 letras.</p>
  <div class="legend">
    <span><i style="background:var(--green)"></i>Letra correcta en su lugar</span>
    <span><i style="background:var(--amber)"></i>Letra en la palabra, pero en otro lugar</span>
    <span><i style="background:var(--absent);border:1px solid var(--surface-2)"></i>Letra que no está</span>
  </div>
  <p><b>Diario:</b> una palabra al día, la misma para todos. Compara tu resultado con tus amigos.<br><b>Libre:</b> todas las partidas que quieras.</p>
  <p>Toca un cuadrito para escribir en ese lugar; puedes llenar las letras en el orden que quieras.</p>
  <p>Solo se aceptan palabras reales, sin acentos. Si una palabra real no se acepta, toca «Agregar» y quedará guardada en tu teléfono. Tienes una pista por partida.</p>
  <button class="primary" id="closeBtn">¡A jugar!</button>`);
$('settingsBtn').onclick = () => {
  const row = (id, title, desc) => `<label class="opt" for="${id}"><span><b>${title}</b><small>${desc}</small></span><input type="checkbox" id="${id}" ${settings[id.slice(4)] ? 'checked' : ''}><i class="sw"></i></label>`;
  showModal(`<h2>Ajustes</h2>
    ${row('opt-hard','Modo difícil','Debes usar las letras que ya descubriste')}
    ${row('opt-vibrate','Vibración','Al acertar, perder o escribir mal')}
    ${row('opt-randomLen','Largo al azar','En modo Libre, cada partida nueva tiene 5, 6, 7 u 8 letras')}
    ${row('opt-ghosts','Letras descubiertas','Muestra en la fila las letras que ya tienes')}
    ${row('opt-contrast','Alto contraste','Naranja = en su lugar, azul = en otro lugar')}
    <div class="opt-title">Tema</div>
    <div class="themes">${[['dark','Oscuro','#0c0d10','#2e2f33','#45474d'],['purple','Morado','#150e22','#2c2240','#453860'],['blue','Azul','#0a1424','#1c2c44','#33476a']].map(([k,n,a,b,c]) =>
      `<button data-theme-opt="${k}" aria-pressed="${settings.theme === k}" style="background:${b}"><i><b style="background:${a}"></b><b style="background:${c}"></b><b style="background:#2f8a5c"></b><b style="background:#f2ab2a"></b></i>${n}</button>`).join('')}</div>
    ${store.get('ps-custom', []).length ? `<div class="opt-title">Palabras que agregaste</div><p class="sub" style="text-align:left">${store.get('ps-custom', []).map(w => w.toUpperCase()).join(', ')}</p><button class="secondary" id="clearCustom">Borrar palabras agregadas</button>` : ''}
    <button class="primary" id="closeBtn">Listo</button>`, () => {
    const cc = $('clearCustom'); if (cc) cc.onclick = () => { store.get('ps-custom', []).forEach(w => DICT.delete(w)); store.set('ps-custom', []); POOL.forEach(w => DICT.add(w)); toast('Palabras agregadas borradas'); closeModal() };
    document.querySelectorAll('[data-theme-opt]').forEach(b => b.onclick = () => {
      settings.theme = b.dataset.themeOpt; store.set('ps-settings', settings); applySettings();
      document.querySelectorAll('[data-theme-opt]').forEach(x => x.setAttribute('aria-pressed', x === b));
    });
    ['hard','vibrate','contrast','ghosts','randomLen'].forEach(k => $('opt-' + k).onchange = e => {
      if (k === 'hard' && e.target.checked && game.guesses.length && !game.over){ e.target.checked = false; return toast('Activa el modo difícil al empezar una partida') }
      settings[k] = e.target.checked; store.set('ps-settings', settings); applySettings(); draw(); if (k === 'randomLen'){ setNewIcon(); if (settings.randomLen && mode === 'free') toast('Toca 🎲 o termina la partida para cambiar de largo') }
    });
  });
};
function applySettings(){
  const r = document.documentElement;
  r.classList.toggle('contrast', settings.contrast);
  r.classList.toggle('theme-purple', settings.theme === 'purple');
  r.classList.toggle('theme-blue', settings.theme === 'blue');
  const m = document.querySelector('meta[name="theme-color"]');
  if (m) m.content = { dark:'#0c0d10', purple:'#150e22', blue:'#0a1424' }[settings.theme] || '#0c0d10';
}

// ---------- cargar partidas ----------
function save(){ store.set(gameKey(), game) }
function resetVisuals(){
  [...board.children].forEach(r => [...r.children].forEach(t => { t.textContent = ''; t.className = 'tile' }));
  kb.querySelectorAll('.key').forEach(b => { b.classList.remove('correct','present','absent'); delete b.dataset.s });
}
function render(){
  resetVisuals(); clearSlots();
  game.guesses.forEach((guess, r) => {
    const res = score(guess, game.answer);
    [...board.children[r].children].forEach((t,i) => { t.textContent = [...guess][i]; t.classList.add(res[i]) });
    paintKeys(guess, res);
  });
  showHint(); draw();
}
const REDO_ICON = $('newBtn').innerHTML;
const DICE_ICON = '<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="3.5" width="17" height="17" rx="4"/><circle cx="8.5" cy="8.5" r="1.3" fill="currentColor" stroke="none"/><circle cx="15.5" cy="15.5" r="1.3" fill="currentColor" stroke="none"/><circle cx="12" cy="12" r="1.3" fill="currentColor" stroke="none"/><circle cx="15.5" cy="8.5" r="1.3" fill="currentColor" stroke="none"/><circle cx="8.5" cy="15.5" r="1.3" fill="currentColor" stroke="none"/></svg>';
function setNewIcon(){ $('newBtn').innerHTML = settings.randomLen ? DICE_ICON : REDO_ICON; $('newBtn').setAttribute('aria-label', settings.randomLen ? 'Nueva palabra con largo al azar' : 'Nueva palabra') }
function newFree(){
  if (mode === 'free' && settings.randomLen && game){
    const opts = LENGTHS.filter(n => n !== COLS);
    COLS = opts[Math.floor(Math.random() * opts.length)]; store.set('ps-len', COLS);
    LENGTHS.forEach(x => $('len-' + x).setAttribute('aria-pressed', x === COLS));
    buildBoard();
  }
  const list = BYLEN[COLS], prev = game && game.answer;
  let next; do { next = list[Math.floor(Math.random() * list.length)] } while (next === prev && list.length > 1);
  game = { answer: next, guesses: [], over: false, won: false, hint: null }; save(); render();
}
function load(){
  modeBtns.daily.setAttribute('aria-pressed', mode === 'daily'); modeBtns.free.setAttribute('aria-pressed', mode === 'free');
  LENGTHS.forEach(x => $('len-' + x).setAttribute('aria-pressed', x === COLS));
  $('newBtn').hidden = mode === 'daily'; setNewIcon();
  buildBoard();
  const saved = store.get(gameKey(), null);
  if (mode === 'daily'){
    const answer = dailyWord(COLS, todayKey());
    game = saved && saved.answer === answer ? saved : { answer, guesses: [], over: false, won: false, hint: null };
    render(); if (game.over) setTimeout(showResult, 300);
  } else if (saved && saved.answer && !saved.over){ game = saved; render() }
  else { game = null; newFree() }
}

applySettings(); load();
if (!store.get('ps-seen3', false)){ store.set('ps-seen3', true); $('helpBtn').click() }
</script>

<script>
if('serviceWorker' in navigator){
  const hadController = !!navigator.serviceWorker.controller; let reloaded = false;
  navigator.serviceWorker.addEventListener('controllerchange', () => { if (hadController && !reloaded){ reloaded = true; location.reload() } });
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' }).then(r => {
    r.update().catch(() => {});
    document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') r.update().catch(() => {}) });
  }).catch(() => {}));
}
</script>
