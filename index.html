<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);box-sizing:border-box;height:100%}
body{margin:0;font-size:14px}

</style>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@500;700;800&display=swap">
<style>
/* Una sola pantalla: título, selector de largo, tablero que se ajusta, teclado español con Ñ */
:root{
  --bg:#0c0d10; --surface:#2e2f33; --surface-2:#45474d; --fg:#f5f5f2; --muted:#9a9ca3;
  --green:#2f8a5c; --amber:#f2ab2a; --brand-green:#2f8a5c; --brand-amber:#f2ab2a; --brand-edge:#226b46; --amber-edge:#d98a12; --green-edge:#226b46; --absent:#1b1c1f; --card:#1a1b1f; --absent-fg:#c9cad0; --key-absent-fg:#6d6f75; --del:#b5483e; --del-edge:#8c3229;
  --display:'Fredoka','Nunito',system-ui,sans-serif; --body:'Nunito',system-ui,sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--body);overflow:hidden;-webkit-tap-highlight-color:transparent;user-select:none}
.app{height:100%;display:flex;flex-direction:column;max-width:520px;margin:0 auto;box-sizing:border-box;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:8px}
header{display:flex;align-items:center;justify-content:space-between;gap:8px;padding-bottom:8px}
h1{font-family:var(--display);font-weight:700;font-size:1.45rem;margin:0;letter-spacing:.01em}
h1 span{color:var(--brand-amber)}
.icon-btn{background:var(--surface);color:var(--fg);border:0;border-radius:10px;height:38px;min-width:38px;padding:0 12px;font:700 .85rem var(--body);cursor:pointer}
button:focus-visible{outline:2px solid var(--brand-amber);outline-offset:2px}
.lengths{display:flex;align-items:center;justify-content:center;gap:6px;padding:8px 0;border-top:1px solid var(--surface);border-bottom:1px solid var(--surface)}
.lengths small{color:var(--muted);font-weight:700;font-size:.78rem;margin-right:4px;text-transform:uppercase;letter-spacing:.05em}
.len{background:var(--surface);color:var(--fg);border:0;border-radius:9px;width:40px;height:34px;font:700 1rem var(--display);cursor:pointer}
.len[aria-pressed="true"]{background:var(--brand-green);box-shadow:inset 0 -3px 0 var(--brand-edge)}
.board-wrap{flex:1;display:flex;align-items:center;justify-content:center;min-height:0;padding:10px 0}
.board{display:grid;gap:var(--gap,6px)}
.row{display:grid;gap:var(--gap,6px)}
.row.shake{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
.tile{background:var(--surface);border-radius:calc(var(--tile,56px) * .2);display:flex;align-items:center;justify-content:center;
  width:var(--tile,56px);height:var(--tile,56px);font-family:var(--display);font-weight:600;font-size:calc(var(--tile,56px) * .52);
  text-transform:uppercase;box-shadow:inset 0 -3px 0 rgba(0,0,0,.25)}
.tile.filled{background:var(--surface-2);animation:pop .1s}
@keyframes pop{50%{transform:scale(1.08)}}
.tile.correct{background:var(--green);box-shadow:inset 0 -4px 0 var(--green-edge)}
.tile.present{background:var(--amber);box-shadow:inset 0 -4px 0 var(--amber-edge)}
.tile.absent{background:var(--absent);color:var(--absent-fg)}
.tile.flip{animation:flip .45s ease both}
@keyframes flip{0%{transform:rotateX(0)}50%{transform:rotateX(90deg)}100%{transform:rotateX(0)}}
.kb{display:flex;flex-direction:column;gap:6px;padding-bottom:4px}
.kr{display:flex;gap:5px;justify-content:center}
.key{flex:1;max-width:44px;height:54px;border:0;border-radius:8px;background:var(--surface-2);color:var(--fg);
  font:700 1.05rem var(--body);cursor:pointer;padding:0;touch-action:manipulation}
.key.wide{max-width:66px;flex:1.5;font-size:.75rem}
.key:active{filter:brightness(1.25)}
.key.correct{background:var(--green)} .key.present{background:var(--amber)} .key.absent{background:var(--absent);color:var(--key-absent-fg)}
.toast{position:fixed;left:50%;top:calc(110px + env(safe-area-inset-top,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);
  font-weight:800;padding:10px 16px;border-radius:10px;z-index:20;max-width:calc(100% - 32px);text-align:center}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);display:flex;align-items:center;justify-content:center;z-index:30;padding:16px}
.card{background:var(--card);border-radius:18px;padding:22px;width:100%;max-width:360px;text-align:center;box-sizing:border-box}
.card h2{font-family:var(--display);margin:0 0 6px;font-size:1.5rem}
.card p{color:var(--muted);margin:6px 0;line-height:1.45}
.answer{display:inline-flex;gap:4px;margin:10px 0;flex-wrap:wrap;justify-content:center}
.answer b{width:34px;height:34px;border-radius:8px;background:var(--green);display:flex;align-items:center;justify-content:center;font-family:var(--display);font-size:1.15rem}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:14px 0;font-variant-numeric:tabular-nums}
.stats div{font-size:1.5rem;font-weight:800;font-family:var(--display)}
.stats small{display:block;font-size:.65rem;color:var(--muted);font-family:var(--body);font-weight:700;text-transform:uppercase;letter-spacing:.04em}
.legend{display:flex;flex-direction:column;gap:8px;text-align:left;margin:12px 0}
.legend span{display:flex;align-items:center;gap:10px;color:var(--fg)}
.legend i{width:28px;height:28px;border-radius:7px;flex:none}
.primary{background:var(--brand-green);color:#fff;border:0;border-radius:12px;padding:13px 20px;font:800 1rem var(--body);width:100%;margin-top:8px;cursor:pointer}
@media (prefers-reduced-motion:reduce){.tile.flip,.tile.filled,.row.shake{animation:none}}
@media (max-height:640px){.key{height:46px}}

h1{font-size:1.3rem;white-space:nowrap}
.tools{display:flex;gap:6px}
.icon-btn{display:inline-flex;align-items:center;justify-content:center;padding:0 9px}
#hintBtn.used{color:var(--brand-amber)}
.bar{display:flex;align-items:center;justify-content:center;gap:10px;padding:8px 0;border-top:1px solid var(--surface);border-bottom:1px solid var(--surface)}
.lengths{display:flex;gap:5px;padding:0;border:0}
.len{width:34px}
.seg{display:flex;background:var(--surface);border-radius:10px;padding:3px}
.seg button{border:0;background:none;color:var(--muted);font:800 .82rem var(--body);padding:7px 10px;border-radius:8px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--surface-2);color:var(--fg)}
.hint-line{text-align:center;color:var(--muted);font-size:.85rem;padding-top:6px}
.reto-line{display:flex;align-items:center;justify-content:center;gap:8px;padding-top:8px;font-weight:800;font-size:.9rem;color:var(--brand-amber)}
.reto-line button{background:var(--surface);color:var(--fg);border:0;border-radius:8px;padding:5px 10px;font:800 .78rem var(--body);cursor:pointer}
.menu{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.menu button{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;background:var(--surface);color:var(--fg);border:0;border-radius:12px;padding:13px 14px;font:800 1rem var(--body);cursor:pointer}
.menu small{color:var(--muted);font-weight:600;font-size:.8rem}
.field{width:100%;box-sizing:border-box;background:var(--bg);color:var(--fg);border:2px solid var(--surface-2);border-radius:12px;padding:12px;font:700 1.3rem var(--display);text-align:center;letter-spacing:.12em;text-transform:uppercase;margin:10px 0 4px;user-select:text}
.field:focus{outline:none;border-color:var(--brand-amber)}
.err{color:#ff8a7a;font-weight:700;font-size:.85rem;min-height:1.2em;margin:4px 0}
.code{font:700 2rem var(--display);letter-spacing:.15em;color:var(--brand-amber);margin:8px 0;user-select:text}
.linkbox{font-size:.78rem;color:var(--muted);word-break:break-all;user-select:text;background:var(--bg);border-radius:8px;padding:8px;margin:6px 0}
.coach{margin-top:8px;background:var(--card);border:2px solid var(--brand-amber);border-radius:12px;padding:10px 12px;display:flex;align-items:center;gap:10px;font-size:.9rem;line-height:1.35}
.coach p{margin:0;flex:1}
.coach button{flex:none;background:var(--brand-green);color:#fff;border:0;border-radius:9px;padding:8px 12px;font:800 .85rem var(--body);cursor:pointer}
.coach .cg{color:var(--green)}.coach .cy{color:var(--amber)}
body.in-tuto .bar{opacity:.4}
.tile.win{animation:bounce .5s ease}
@keyframes bounce{0%,100%{transform:translateY(0)}40%{transform:translateY(-14px)}70%{transform:translateY(3px)}}
.len{position:relative}
.len.done-win::after,.len.done-lose::after{content:"✓";position:absolute;top:-5px;right:-5px;width:15px;height:15px;border-radius:50%;font:800 .62rem/15px var(--body);color:#fff;background:var(--brand-green)}
.len.done-lose::after{content:"✕";background:#8a4a4a}
.def{background:var(--surface);border-radius:12px;padding:10px 12px;margin:4px 0 8px;text-align:left}
.def p{margin:4px 0 0;color:var(--fg);font-size:.92rem}
.tag{display:inline-block;font-size:.7rem;font-weight:800;text-transform:uppercase;letter-spacing:.05em;color:var(--brand-amber)}
.mini{display:flex;gap:4px;justify-content:center;margin:10px 0 2px}
.mini b{width:34px;height:34px;border-radius:7px;background:var(--surface-2);display:flex;align-items:center;justify-content:center;font-family:var(--display);font-size:1.1rem}
.mini b.correct{background:var(--green)}.mini b.present{background:var(--amber)}.mini b.absent{background:var(--absent);color:var(--absent-fg)}
.dots{display:flex;gap:6px;justify-content:center;margin:14px 0 4px}
.dots i{width:7px;height:7px;border-radius:50%;background:var(--surface-2)}.dots i.on{background:var(--brand-amber)}
.btnrow{display:flex;gap:8px}.btnrow>*{flex:1}
.legend .ico{background:none!important;width:auto;min-width:28px;height:auto;font-style:normal;font-size:1.05rem;text-align:center;font-weight:800}
.pick-len,.cats{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin:8px 0}
.pick-len button,.cats button{background:var(--surface);color:var(--fg);border:0;border-radius:12px;padding:12px 8px;font:800 1rem var(--body);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px}
.pick-len button{font:700 1.5rem var(--display)}
.pick-len small,.cats small{font:600 .75rem var(--body);color:var(--muted)}
.achs{display:flex;flex-direction:column;gap:6px;margin:10px 0;text-align:left}
.ach{display:flex;align-items:center;gap:10px;background:var(--surface);border-radius:10px;padding:8px 10px;opacity:.55}
.ach.on{opacity:1}.ach span{font-size:1.4rem;width:30px;text-align:center}
.ach b{display:block;font-size:.92rem}.ach small{color:var(--muted);font-size:.78rem}
#timeLeft{font-variant-numeric:tabular-nums}#timeLeft.low{color:#ff8a7a}
.hint-line b{color:var(--fg);background:var(--surface-2);padding:1px 7px;border-radius:5px}
.sub{font-size:.8rem;margin-top:4px}
.dist{display:flex;flex-direction:column;gap:4px;margin:8px 0 14px;font-variant-numeric:tabular-nums}
.drow{display:flex;align-items:center;gap:8px;font-weight:800;font-size:.85rem}
.drow span{width:12px;color:var(--muted)}
.dbar{background:var(--surface-2);border-radius:4px;padding:3px 7px;text-align:right;min-width:22px;box-sizing:border-box}
.dbar.now{background:var(--green)}
.secondary{background:var(--surface);color:var(--fg);border:0;border-radius:12px;padding:12px 20px;font:800 .95rem var(--body);width:100%;margin-top:8px;cursor:pointer}
.opt{display:flex;align-items:center;justify-content:space-between;gap:12px;text-align:left;padding:12px 0;border-bottom:1px solid var(--surface);cursor:pointer}
.opt b{display:block}.opt small{color:var(--muted);font-size:.8rem}
.opt input{position:absolute;opacity:0;pointer-events:none}
.sw{flex:none;width:44px;height:26px;border-radius:13px;background:var(--surface-2);position:relative;transition:background .2s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:var(--fg);transition:transform .2s}
.opt input:checked + .sw{background:var(--brand-green)}
.opt input:checked + .sw::after{transform:translateX(18px)}
.opt input:focus-visible + .sw{outline:2px solid var(--amber);outline-offset:2px}
textarea{width:100%;box-sizing:border-box;background:var(--bg);color:var(--fg);border:1px solid var(--surface-2);border-radius:10px;padding:10px;font:600 .95rem var(--body);margin:10px 0;user-select:text}
.theme-purple{--bg:#150e22;--surface:#2c2240;--surface-2:#453860;--absent:#1e1630;--card:#20172f;--muted:#ab9fc4;--brand-amber:#f5b63c}
.theme-blue{--bg:#0a1424;--surface:#1c2c44;--surface-2:#33476a;--absent:#122038;--card:#142139;--muted:#97a9c6;--brand-amber:#f5b63c}
.toast-btn{margin-left:8px;background:var(--brand-green);color:#fff;border:0;border-radius:8px;padding:6px 12px;font:800 .85rem var(--body);cursor:pointer}
.tile.cursor{outline:3px solid var(--fg);outline-offset:-3px;cursor:pointer}
.row .tile{cursor:default}
.tile.ghost{color:var(--green);box-shadow:inset 0 0 0 2px var(--green);opacity:.85}
.themes{display:flex;gap:10px;justify-content:center;margin:6px 0 4px}
.themes button{flex:1;border:2px solid transparent;border-radius:12px;padding:10px 4px 8px;color:var(--fg);font:800 .8rem var(--body);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:6px}
.themes button[aria-pressed="true"]{border-color:var(--brand-amber)}
.themes i{display:flex;gap:3px}.themes i b{width:12px;height:12px;border-radius:3px}
.opt-title{text-align:left;font-weight:800;margin:14px 0 4px}
.contrast{--green:#e8732c;--green-edge:#b9561a;--amber:#4f9fe8;--amber-edge:#2f78bd}
.card{max-height:calc(100vh - 32px);overflow-y:auto}
@media (max-width:370px){.seg button{padding:7px 7px}.len{width:30px}.bar{gap:6px}h1{font-size:1.15rem}}
.len{width:31px}
.board.duo{display:flex;gap:14px;align-items:flex-start}
.board.duo .grid{display:grid;gap:var(--gap)}
.board.duo .grid.solved{opacity:.55}
.key.absent{opacity:.5}
a.toast-btn{display:inline-block;text-decoration:none}
.btnlink{display:block;text-align:center;text-decoration:none;box-sizing:border-box}
.field.small{font-size:1.05rem;letter-spacing:.02em;text-transform:none;margin:6px 0}
.pick-len.row5{grid-template-columns:repeat(5,1fr)}
.pick-len.row5 button{padding:10px 2px}
.pick-len button[aria-pressed="true"]{background:var(--brand-green);color:#fff}
.pres{display:flex;flex-direction:column;align-items:flex-start;gap:2px;background:var(--surface);border-radius:12px;padding:10px 12px;margin:6px 0;text-align:left}
.pres.win{box-shadow:inset 0 0 0 2px var(--brand-green)}
.pres span{font-weight:800}.pres small{color:var(--muted)}
.score2{font-weight:800;margin:12px 0;font-size:1.05rem}
.score2 b{font-family:var(--display);font-size:1.4rem;color:var(--brand-amber)}
.hist{display:flex;flex-direction:column;gap:5px;margin:6px 0 10px}
.hrow,.hhead{display:flex;align-items:center;justify-content:space-between;gap:8px}
.hrow>span,.hhead>span{font-size:.82rem;color:var(--muted);font-weight:700;text-align:left;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hrow>div,.hhead>div{display:flex;gap:4px;flex:none}
.hhead i{width:30px;text-align:center;font-style:normal;font-size:.72rem;color:var(--muted);font-weight:800}
.hchip{width:30px;height:28px;border:0;border-radius:7px;background:var(--surface);color:var(--muted);font:800 .8rem var(--body);cursor:pointer;padding:0}
.hchip.win{background:var(--green);color:#fff}
.hchip.lose{background:#8a4a4a;color:#fff}
.hchip.prog{background:var(--amber);color:#fff}
.shot{width:100%;border-radius:12px;margin:8px 0;-webkit-user-select:auto;user-select:auto;-webkit-touch-callout:default}
.hint-line i{color:var(--fg)}
.theme-light{--bg:#f2f3f6;--surface:#e1e3e9;--surface-2:#c5c9d2;--fg:#17181c;--muted:#5b5f69;--card:#ffffff;--absent:#8b8f99;--absent-fg:#ffffff;--key-absent-fg:#eef0f4;--brand-amber:#c98100;color-scheme:light}
.theme-light .tile.correct,.theme-light .tile.present,.theme-light .key.correct,.theme-light .key.present,.theme-light .mini b.correct,.theme-light .mini b.present,.theme-light .answer b,.theme-light .hint-line b{color:#fff}
.theme-light .hint-line b{background:var(--brand-green)}
.theme-light .overlay{background:rgba(20,22,30,.45)}
.theme-light .card{box-shadow:0 10px 30px rgba(0,0,0,.18)}
.big .card p,.big .legend span,.big .menu button,.big .opt b,.big .def p{font-size:1.1rem}
.big .card small,.big .sub,.big .opt small{font-size:.95rem}
.big .card h2{font-size:1.8rem}
.big .key{font-size:1.3rem}
.big .key.wide{font-size:.85rem}
.big .hint-line,.big .reto-line,.big .coach,.big .toast{font-size:1.05rem}
@media (max-width:370px){.len{width:29px}}

.key[data-k="Enter"]{background:var(--brand-green);color:#fff;box-shadow:inset 0 -3px 0 var(--brand-edge)}
.key[data-k="Backspace"]{background:var(--del);color:#fff;box-shadow:inset 0 -3px 0 var(--del-edge);font-size:1.2rem}
</style>

</head>
<body>
<div class="app">
  <header>
    <button class="icon-btn" id="menuBtn" aria-label="Menú"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
    <h1>Palabra <span>Secreta</span></h1>
    <div class="tools">
      <button class="icon-btn" id="hintBtn" aria-label="Pista"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-3.5 10.9c.6.5 1 1.2 1 2.1h5c0-.9.4-1.6 1-2.1A6 6 0 0 0 12 3z"/></svg></button>
      <button class="icon-btn" id="statsBtn" aria-label="Estadísticas"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 20V10M12 20V4M19 20v-7"/></svg></button>
      <button class="icon-btn" id="settingsBtn" aria-label="Ajustes"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button>
    </div>
  </header>
  <div class="bar">

    const notes = { key:[[660,.03]], flip:[[440,.05]], error:[[180,.12]], win:[[523,.1],[659,.1],[784,.1],[1047,.2]], lose:[[392,.15],[330,.15],[262,.3]], point:[[784,.08],[1047,.12]] }[kind] || [];
    let t = actx.currentTime;

      const o = actx.createOscillator(), g = actx.createGain();
      o.type = 'triangle'; o.frequency.value = f; g.gain.setValueAtTime(.12, t); g.gain.exponentialRampToValueAtTime(.001, t + d);

function keyInfo(ch){
  if (!game) return;

  const yes = new Set(), no = new Set(); let used = false, inWord = false;
  game.guesses.forEach(w => score(w, game.answer).forEach((r,i) => {
    if ([...w][i] !== ch) return; used = true;
    if (r === 'correct'){ yes.add(i+1); inWord = true } else { no.add(i+1); if (r === 'present') inWord = true }
  }));
  if (!used) return toast(`Aún no has probado la ${L}`);
  if (!inWord) return toast(`La ${L} no está en la palabra`);
  const parts = [], no2 = [...no].filter(x => !yes.has(x)).sort((a,b) => a-b);
  if (yes.size) parts.push(`va en la posición ${[...yes].sort((a,b) => a-b).join(' y ')}`);
  if (no2.length) parts.push(`no va en ${no2.length === 1 ? 'la posición' : 'las posiciones'} ${no2.join(', ')}`);

function press(k){

function score(guess, ans){
  const res = Array(COLS).fill('absent'), a = [...ans], g = [...guess];
  g.forEach((ch,i) => { if (ch === a[i]){ res[i] = 'correct'; a[i] = null } });
  g.forEach((ch,i) => { if (res[i] !== 'correct'){ const j = a.indexOf(ch); if (j > -1){ res[i] = 'present'; a[j] = null } } });

}

function hardModeError(guess){

    for (let i = 0; i < COLS; i++) if (res[i] === 'present' && !g.includes(p[i])) return `Debes usar la ${p[i].toUpperCase()}`;
  }
  if (game.hint && game.hint.letter && g[game.hint.pos] !== game.hint.letter) return `La letra ${game.hint.pos+1} debe ser ${game.hint.letter.toUpperCase()}`;

}

  const label = mode === 'daily' ? date : mode === 'arch' ? `${+archDay.slice(8)}/${+archDay.slice(5,7)}` : mode === 'pass' ? '(duelo)' : mode === 'reto' ? '(tu reto)' : mode === 'cat' ? `(${CATS[cat.key]})` : '(libre)';
  const head = `Palabra Secreta ${label} · ${COLS} letras ${game.won ? game.guesses.length : 'X'}/${ROWS}${settings.hard ? '*' : ''}${game.hint ? ' (con pista)' : ''}`;
  const grid = game.guesses.map(w => score(w, game.answer).map(r => r === 'correct' ? g : r === 'present' ? y : b).join('')).join('\n');

function letterHint(){
  const a = [...game.answer], known = new Set();
  game.guesses.forEach(w => score(w, game.answer).forEach((r,i) => { if (r === 'correct') known.add(i) }));
  const open = a.map((_,i) => i).filter(i => !known.has(i));
  if (!open.length) return toast('Ya tienes todas las letras');
  const pos = open[hash(game.answer + game.guesses.length) % open.length];
  game.hint = { pos, letter: a[pos] }; save(); showHint(); draw();
  toast(`Pista: la letra ${pos+1} es ${a[pos].toUpperCase()}`);
}
function showHint(){
  const h = $('hintLine');
  h.hidden = !game.hint || mode === 'duo';

function load(keepGame){

function startDuo(n){
  stopTimer(); reto = null; cat = null; passRun = null; archDay = null; tuto = null;
  mode = 'duo'; COLS = n; closeModal();
  const list = freeList(n), a = pick(list), b = pick(list, a);
  game = { answer: a, answers: [a, b], solvedAt: [-1, -1], guesses: [], over: false, won: false, hint: null };
  load(true);
}
function duoBuild(){
  board.innerHTML = ''; board.classList.add('duo');
  for (let k = 0; k < 2; k++){
    const g = document.createElement('div'); g.className = 'grid';
    for (let r = 0; r < DUO_ROWS; r++){
      const row = document.createElement('div'); row.className = 'row';
      row.style.gridTemplateColumns = `repeat(${COLS}, var(--tile))`;
      for (let c = 0; c < COLS; c++){ const t = document.createElement('div'); t.className = 'tile'; row.appendChild(t) }
      g.appendChild(row);
    }
    board.appendChild(g);
  }
}
function duoSize(){
  const gap = 4, mid = 14, w = (wrap.clientWidth - mid) / 2, h = wrap.clientHeight - 16;
  const size = Math.max(16, Math.floor(Math.min((w - gap*(COLS-1)) / COLS, (h - gap*(DUO_ROWS-1)) / DUO_ROWS, 48)));
  board.style.setProperty('--tile', size + 'px'); board.style.setProperty('--gap', gap + 'px');
}
const duoRow = (k, r) => board.children[k] && board.children[k].children[r];
const duoDone = k => !!game && !!game.solvedAt && game.solvedAt[k] >= 0;
function duoRender(){
  resetVisuals(); clearSlots();
  for (let k = 0; k < 2; k++){
    const last = duoDone(k) ? game.solvedAt[k] : game.guesses.length - 1;
    for (let r = 0; r <= last; r++){
      const res = score(game.guesses[r], game.answers[k]);
      [...duoRow(k, r).children].forEach((t,i) => { t.textContent = [...game.guesses[r]][i]; t.classList.add(res[i]) });
    }
    board.children[k].classList.toggle('solved', duoDone(k) && !game.over);
  }
  duoKeys(); $('hintLine').hidden = true; $('hintBtn').classList.remove('used'); duoDraw();
}
function duoDraw(){
  const r = game.guesses.length;
  for (let k = 0; k < 2; k++){
    if (duoDone(k) || game.over) continue;
    const row = duoRow(k, r); if (!row) continue;
    [...row.children].forEach((t,i) => {
      t.textContent = slots[i] || '';
      t.classList.toggle('filled', !!slots[i]);
      t.classList.toggle('cursor', i === cursor && !busy);
    });
  }
}
function duoSubmit(guess){
  const r = game.guesses.length, step = COLS > 6 ? 150 : 190, newly = [];
  game.guesses.push(guess); clearSlots(); busy = true;
  for (let k = 0; k < 2; k++){
    if (duoDone(k)) continue;
    const row = duoRow(k, r), res = score(guess, game.answers[k]);
    [...row.children].forEach((t,i) => {
      t.classList.remove('cursor');
      setTimeout(() => {
        t.classList.add('flip'); if (k === 0) sfx('flip');
        setTimeout(() => { t.classList.remove('filled'); t.classList.add(res[i]) }, 200);
      }, i * step);
    });
    if (guess === game.answers[k]){ game.solvedAt[k] = r; newly.push(k) }
  }
  setTimeout(() => {
    busy = false; duoKeys();
    newly.forEach(k => { board.children[k].classList.add('solved'); [...duoRow(k, r).children].forEach((t,i) => setTimeout(() => t.classList.add('win'), i * 90)) });
    if (newly.length) sfx('point');
    if (duoDone(0) && duoDone(1)) finish(true);
    else if (game.guesses.length === DUO_ROWS) finish(false);
    else duoDraw();
  }, COLS * step + 300);
}
const KEYCOL = { correct:'var(--green)', present:'var(--amber)', absent:'var(--absent)' };
function duoKeys(){
  kb.querySelectorAll('.key').forEach(b => {
    const ch = b.dataset.k; if (ch.length > 1) return;
    const st = [0,1].map(k => {
      if (duoDone(k) && !game.over) return 'done';
      let best = null;
      game.guesses.slice(0, duoDone(k) ? game.solvedAt[k] + 1 : game.guesses.length).forEach(g => score(g, game.answers[k]).forEach((s,i) => { if ([...g][i] === ch && (!best || rank[s] > rank[best])) best = s }));
      return best;
    });
    const [l, r] = st.map((s, k) => s === 'done' ? (st[1-k] === 'done' ? null : st[1-k]) : s);
    b.classList.remove('correct','present','absent'); b.style.background = '';
    if (!l && !r) return;
    if (l === 'absent' && r === 'absent') return b.classList.add('absent');
    b.style.background = `linear-gradient(90deg, ${l ? KEYCOL[l] : 'var(--surface-2)'} 50%, ${r ? KEYCOL[r] : 'var(--surface-2)'} 50%)`;
  });
}
function showDuoResult(){

    <p>${game.won ? `Adivinaste las dos en ${n} de ${DUO_ROWS} intentos.` : `Adivinaste ${got} de 2. Las palabras eran:`}</p>
    ${game.answers.map(w => `<div class="answer">${[...showWord(w)].map(c => `<b>${c.toUpperCase()}</b>`).join('')}</div>${defHTML(w)}`).join('')}

function duoShareText(){
  const [g, y, b] = settings.contrast ? ['🟧','🟦','⬛'] : ['🟩','🟨','⬛'];
  const em = (w, ans) => score(w, ans).map(r => r === 'correct' ? g : r === 'present' ? y : b).join('');

  return `Palabra Secreta · Doble palabra (${COLS} letras) ${game.won ? game.guesses.length : 'X'}/${DUO_ROWS}\n\nPalabra 1:\n${blocks[0]}\n\nPalabra 2:\n${blocks[1]}`;
}

function passRound(){

function passTurn(){

  load(true);

}
function passAfter(){
  const r = passRun, p = passPlayer();
  r.res[p] = { tries: game.won ? game.guesses.length : ROWS + 1, won: game.won, word: game.answer, hint: !!game.hint };
  if (r.turn === 0){
    r.turn = 1;
    return showModal(`<h2>${esc(r.names[p])} terminó</h2>
      <p>${game.won ? `Adivinó en <b>${game.guesses.length}</b> ${game.guesses.length === 1 ? 'intento' : 'intentos'}.` : 'No logró adivinar su palabra.'}</p>

  }
  const [a, b] = r.res, win = a.tries === b.tries ? -1 : a.tries < b.tries ? 0 : 1;
  if (win >= 0) r.wins[win]++;
  unlock('pase'); sfx('win');
  const line = i => `<div class="pres${win === i ? ' win' : ''}"><b>${esc(r.names[i])}${win === i ? ' 🏆' : ''}</b><span>${r.res[i].won ? `${r.res[i].tries} ${r.res[i].tries === 1 ? 'intento' : 'intentos'}` : 'No la adivinó'}${r.res[i].hint ? ' · con pista' : ''}</span><small>Su palabra: ${showWord(r.res[i].word).toUpperCase()}</small></div>`;
  showModal(`<p class="sub">Ronda ${r.round}</p>
    <h2>${win < 0 ? '¡Empate!' : `¡Gana ${esc(r.names[win])}!`}</h2>
    ${line(0)}${line(1)}
    <div class="score2">${esc(r.names[0])} <b>${r.wins[0]}</b> – <b>${r.wins[1]}</b> ${esc(r.names[1])}</div>
    <button class="primary" id="passAgain">Otra ronda</button>
    <button class="secondary" id="leaveBtn">Terminar</button>`, () => {
    $('passAgain').onclick = () => { closeModal(); passRound() };
    $('leaveBtn').onclick = () => { closeModal(); goNormal() };
  }, true);
}

// ---------- compartir como imagen ----------
function roundRect(x, a, b, w, h, r){ x.beginPath(); x.moveTo(a + r, b); x.arcTo(a + w, b, a + w, b + h, r); x.arcTo(a + w, b + h, a, b + h, r); x.arcTo(a, b + h, a, b, r); x.arcTo(a, b, a + w, b, r); x.closePath() }
function shareImage(){
  const cs = getComputedStyle(document.documentElement), v = n => cs.getPropertyValue(n).trim();
  const size = 56, gap = 8, rows = game.guesses.length, W = 600;
  const gridW = COLS * size + (COLS - 1) * gap, oy = 210, H = oy + rows * (size + gap) + 80;
  const c = document.createElement('canvas'); c.width = W; c.height = H;
  const x = c.getContext('2d');
  x.fillStyle = v('--bg'); x.fillRect(0, 0, W, H);
  x.font = '700 44px Fredoka, Nunito, sans-serif'; x.textAlign = 'left';
  const t1 = 'Palabra ', t2 = 'Secreta', w1 = x.measureText(t1).width, w2 = x.measureText(t2).width, sx = (W - w1 - w2) / 2;
  x.fillStyle = v('--fg'); x.fillText(t1, sx, 74); x.fillStyle = v('--brand-amber'); x.fillText(t2, sx + w1, 74);
  const head = shareText().split('\n')[0].replace(/^Palabra Secreta\s*/, '').replace(/\s*\d+\/\d+.*$|\s*X\/\d+.*$/, '');
  x.textAlign = 'center'; x.fillStyle = v('--muted'); x.font = '700 22px Nunito, sans-serif'; x.fillText(head, W / 2, 114);
  x.fillStyle = v('--fg'); x.font = '700 56px Fredoka, Nunito, sans-serif';
  x.fillText(`${game.won ? game.guesses.length : 'X'}/${ROWS}`, W / 2, 182);
  const col = { correct: v('--green'), present: v('--amber'), absent: v('--absent') }, ox = (W - gridW) / 2;
  game.guesses.forEach((w, r) => score(w, game.answer).forEach((s, i) => {
    x.fillStyle = col[s]; roundRect(x, ox + i * (size + gap), oy + r * (size + gap), size, size, 10); x.fill();
  }));
  const st = mode === 'daily' || mode === 'free' ? getStats() : null;
  x.fillStyle = v('--muted'); x.font = '700 20px Nunito, sans-serif';
  x.fillText(st ? `Racha: ${st.streak} · Ganadas: ${st.played ? Math.round(st.wins / st.played * 100) : 0}% · ¿Me superas?` : '¿Me superas?', W / 2, oy + rows * (size + gap) + 44);
  const url = c.toDataURL('image/png');
  const fallback = () => showModal(`<h2>Tu resultado</h2><img class="shot" src="${url}" alt="Imagen con tu resultado"><p class="sub">Mantén presionada la imagen para guardarla o compartirla.</p><button class="primary" id="closeBtn">Listo</button>`);
  if (!c.toBlob || !navigator.canShare || window.top !== window) return fallback();
  c.toBlob(blob => {
    try{
      const file = new File([blob], 'palabra-secreta.png', { type: 'image/png' });
      if (navigator.canShare({ files: [file] })) return navigator.share({ files: [file] }).catch(() => {});
    }catch(e){}
    fallback();
  }, 'image/png');
}

applySettings();
if (!store.get('ps-tuto', false)) startTuto(false);
else {
  load(); checkHash();
  if (store.get('ps-news', 0) < NEWS_VER && mode !== 'reto') showNews();
}
</script>

<script>
if('serviceWorker' in navigator){
  const hadController = !!navigator.serviceWorker.controller; let reloaded = false;
  navigator.serviceWorker.addEventListener('controllerchange', () => { if (hadController && !reloaded){ reloaded = true; location.reload() } });
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' }).then(r => {
    r.update().catch(() => {});
    document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') r.update().catch(() => {}) });
  }).catch(() => {}));
}
</script>
